services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aura-db
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura}
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional trace UI. Safe to keep running even when OTEL_EXPORTER_MODE=console.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: aura-jaeger
    restart: on-failure
    ports:
      - "16686:16686"

  mcp_bridge:
    build:
      context: ./mcp-bridge
    container_name: aura-mcp-bridge
    restart: on-failure
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: aura-api
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura}@db:5432/${POSTGRES_DB:-aura}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/workspace/attachments}
      ECOMMERCE_CODEBASE_PATH: ${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}
      MCP_BRIDGE_URL: ${MCP_BRIDGE_URL:-http://mcp_bridge:8080/invoke}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: aura-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./ecommerce_repo:${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}:ro
      - ./runtime/attachments:${ATTACHMENTS_DIR:-/workspace/attachments}:rw
    depends_on:
      db:
        condition: service_healthy
      mcp_bridge:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
    container_name: aura-worker
    restart: on-failure
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura}@db:5432/${POSTGRES_DB:-aura}
      ATTACHMENTS_DIR: ${ATTACHMENTS_DIR:-/workspace/attachments}
      ECOMMERCE_CODEBASE_PATH: ${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}
      MCP_BRIDGE_URL: ${MCP_BRIDGE_URL:-http://mcp_bridge:8080/invoke}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: aura-worker
      RAG_AUTO_INDEX: "false"
      WORKER_NAME: ${WORKER_NAME:-aura-worker}
    volumes:
      - ./ecommerce_repo:${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}:ro
      - ./runtime/attachments:${ATTACHMENTS_DIR:-/workspace/attachments}:rw
    depends_on:
      db:
        condition: service_healthy
      mcp_bridge:
        condition: service_healthy
      jaeger:
        condition: service_started

  # Main UX: welcome, login/register, admin dashboard, and tenant intake routes.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.unified
    container_name: aura-web
    restart: on-failure
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  # Standalone dashboard surface used for focused admin demos.
  web_dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile.dashboard
    container_name: aura-web-dashboard
    restart: on-failure
    ports:
      - "${DASHBOARD_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy

  # Standalone public intake surface used for direct reporter demos.
  web_report:
    build:
      context: ./web
      dockerfile: Dockerfile.report
    container_name: aura-web-report
    restart: on-failure
    ports:
      - "${UNIFIED_WEB_PORT:-3002}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aura_pgdata:
