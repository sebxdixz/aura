services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aura-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: aura-api
    restart: on-failure
    env_file:
      - .env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ECOMMERCE_CODEBASE_PATH: ${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}
      RAG_REPO_NAME: ${RAG_REPO_NAME:-ecommerce}
      RAG_AUTO_INDEX: ${RAG_AUTO_INDEX:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_EMBEDDING_DIM: ${RAG_EMBEDDING_DIM:-1536}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:-aura}@db:5432/${POSTGRES_DB:-aura}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./ecommerce_repo:${ECOMMERCE_CODEBASE_PATH:-/workspace/ecommerce_repo}:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.report
    container_name: aura-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  web_dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile.dashboard
    container_name: aura-web-dashboard
    ports:
      - "${DASHBOARD_PORT:-3001}:80"
    depends_on:
      - api

volumes:
  aura_pgdata:
