<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA Ops Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #111;
      --white: #fff;
      --g50: #fafafa;
      --g100: #f4f4f1;
      --g150: #ece9e1;
      --g200: #d7d2c9;
      --g500: #6f695d;
      --font-sans: "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #f5f1ea; color: var(--black); min-height: 100vh; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 40px; }
    .topbar, .toolbar, .stats, .panel { border: 1px solid var(--g200); background: rgba(255,255,255,.92); }
    .topbar, .toolbar { padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .topbar { justify-content: space-between; margin-bottom: 16px; }
    .brand { font-size: 24px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; }
    .chip, .mono, th, .status {
      font-family: var(--font-mono);
    }
    .chip { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; border: 1px solid var(--g200); padding: 6px 10px; }
    .toolbar { margin-bottom: 16px; }
    .toolbar label, .status { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--g500); }
    .toolbar input { border: 1px solid var(--g200); padding: 9px 10px; min-width: 260px; font-family: var(--font-mono); }
    button { border: none; background: var(--black); color: var(--white); height: 36px; padding: 0 14px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; cursor: pointer; }
    button.ghost { background: var(--white); color: var(--black); border: 1px solid var(--g200); }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); margin-bottom: 16px; }
    .stat { padding: 16px; border-right: 1px solid var(--g200); }
    .stat:last-child { border-right: none; }
    .stat-k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--g500); margin-bottom: 10px; }
    .stat-v { font-size: 36px; font-weight: 900; line-height: 1; }
    .panel-head { padding: 12px 14px; border-bottom: 1px solid var(--g200); display: flex; justify-content: space-between; align-items: center; }
    .panel-title, .panel-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--g500); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1200px; }
    th, td { border-bottom: 1px solid var(--g150); padding: 10px 12px; text-align: left; vertical-align: top; }
    th { background: var(--g50); font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--g500); }
    td { font-size: 12px; color: #2e2a24; }
    .pill { display: inline-block; border: 1px solid var(--g200); padding: 3px 7px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
    .empty { padding: 24px; font-family: var(--font-mono); color: var(--g500); }
    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">AURA</div>
      <div class="chip">Internal Ops Dashboard</div>
    </div>

    <section class="toolbar">
      <label for="tenant_id">Tenant Workspace</label>
      <input id="tenant_id" placeholder="acme-store" />
      <button id="loadWorkspaceBtn" type="button">Load Workspace</button>
      <button id="refreshBtn" class="ghost" type="button">Refresh</button>
      <div class="status" id="statusMsg">waiting for tenant</div>
    </section>

    <section class="stats">
      <article class="stat"><div class="stat-k">Total</div><div class="stat-v" id="stat_total">0</div></article>
      <article class="stat"><div class="stat-k">Open</div><div class="stat-v" id="stat_open">0</div></article>
      <article class="stat"><div class="stat-k">Resolved</div><div class="stat-v" id="stat_resolved">0</div></article>
      <article class="stat"><div class="stat-k">Critical</div><div class="stat-v" id="stat_critical">0</div></article>
      <article class="stat"><div class="stat-k">With Evidence</div><div class="stat-v" id="stat_attachments">0</div></article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Incidents</span>
        <span class="panel-meta" id="incidentsCount">0 records</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Incident</th>
              <th>Description</th>
              <th>Severity</th>
              <th>Service</th>
              <th>Status</th>
              <th>Created</th>
              <th>Attachment</th>
              <th>Evidence</th>
              <th>Influence</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="incidentsBody">
            <tr><td colspan="10" class="empty">No incidents loaded yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const API = window.location.hostname === "localhost"
      ? "http://localhost:8000"
      : `${location.protocol}//${location.hostname}:8000`;

    const tenantInput = document.getElementById("tenant_id");
    const statusMsg = document.getElementById("statusMsg");
    const incidentsBody = document.getElementById("incidentsBody");
    const incidentsCount = document.getElementById("incidentsCount");
    let currentTenant = "";

    document.getElementById("loadWorkspaceBtn").addEventListener("click", loadWorkspace);
    document.getElementById("refreshBtn").addEventListener("click", () => currentTenant ? loadWorkspace() : null);

    incidentsBody.addEventListener("click", async (event) => {
      const btn = event.target.closest("button[data-incident-id]");
      if (!btn) return;
      await resolveIncident(btn.getAttribute("data-incident-id"));
    });

    async function loadWorkspace() {
      const tenant = tenantInput.value.trim();
      if (!tenant) return;
      currentTenant = tenant;
      statusMsg.textContent = `loading ${tenant}...`;

      const params = new URLSearchParams(window.location.search);
      params.set("tenant_id", tenant);
      history.replaceState(null, "", `/?${params.toString()}`);

      try {
        const [dashboardRes, incidentsRes] = await Promise.all([
          fetch(`${API}/api/tenants/${encodeURIComponent(tenant)}/dashboard`),
          fetch(`${API}/api/incidents?tenant_id=${encodeURIComponent(tenant)}`)
        ]);
        const dashboard = await dashboardRes.json();
        const incidents = await incidentsRes.json();
        if (!dashboardRes.ok) throw new Error(dashboard.detail || "tenant not found");
        if (!incidentsRes.ok) throw new Error(incidents.detail || "incident list failed");

        document.getElementById("stat_total").textContent = String(dashboard.total_incidents || 0);
        document.getElementById("stat_open").textContent = String(dashboard.open_incidents || 0);
        document.getElementById("stat_resolved").textContent = String(dashboard.resolved_incidents || 0);
        document.getElementById("stat_critical").textContent = String(dashboard.critical_incidents || 0);
        document.getElementById("stat_attachments").textContent = String((incidents || []).filter((item) => item.attachment && item.attachment.attachment_filename).length);

        renderIncidents(incidents || []);
        statusMsg.textContent = `workspace loaded: ${tenant}`;
      } catch (error) {
        statusMsg.textContent = "workspace load failed";
      }
    }

    function renderIncidents(items) {
      incidentsCount.textContent = `${items.length} records`;
      if (!items.length) {
        incidentsBody.innerHTML = '<tr><td colspan="10" class="empty">No incidents for this tenant.</td></tr>';
        return;
      }

      incidentsBody.innerHTML = items.map((item) => {
        const id = esc(item.incident_id || "");
        const status = String(item.status || "").toUpperCase();
        const created = String(item.created_at || "").replace("T", " ").slice(0, 19);
        const action = String(item.status || "").toLowerCase() === "open"
          ? `<button class="ghost" data-incident-id="${id}">Resolve</button>`
          : "—";

        return `
          <tr>
            <td class="mono">${id}</td>
            <td>${esc(item.description || "")}</td>
            <td><span class="pill">${esc(item.triage?.severity || "low")}</span></td>
            <td class="mono">${esc(item.triage?.affected_service || "-")}</td>
            <td><span class="pill" id="status-${id}">${status}</span></td>
            <td class="mono">${created}</td>
            <td class="mono">${esc(item.attachment?.attachment_filename || "-")}</td>
            <td>${esc(item.triage?.attachment_summary || item.attachment?.attachment_summary || "-")}</td>
            <td>${esc(item.triage?.attachment_influence_reasoning || "-")}</td>
            <td>${action}</td>
          </tr>
        `;
      }).join("");
    }

    async function resolveIncident(incidentId) {
      const response = await fetch(`${API}/api/incidents/${encodeURIComponent(incidentId)}/resolve`, { method: "POST" });
      const data = await response.json();
      if (!response.ok) return;
      await loadWorkspace();
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const tenantFromQuery = new URLSearchParams(window.location.search).get("tenant_id");
    if (tenantFromQuery) {
      tenantInput.value = tenantFromQuery;
      loadWorkspace();
    }
  </script>
</body>
</html>
