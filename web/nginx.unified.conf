server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index welcome.html;

    # Welcome landing
    location = / {
        try_files /welcome.html =404;
    }

    # Tenant admin dashboard
    location = /dashboard {
        try_files /index.html =404;
    }

    location = /dashboard/ {
        try_files /index.html =404;
    }

    # Public intake per tenant
    location ~ ^/intake(/.*)?$ {
        try_files /intake.html =404;
    }

    # Public confirmation page after submit
    location = /thanks {
        try_files /intake.html =404;
    }

    location = /thanks/ {
        try_files /intake.html =404;
    }

    # Static files fallback
    location / {
        try_files $uri /welcome.html;
    }
}
